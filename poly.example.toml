# poly.example.toml — every key poly understands, with its default.
#
# Generated by `poly config export` — do not edit by hand. The prose lives in
# cli/crates/poly-cli/src/poly.example.toml.in; every name, version and default
# in it is read out of poly 0.10.0 itself, so this file cannot drift from the
# binary the way a hand-maintained one did.
#
# poly.toml is optional; everything below is already in effect without one.
# Copy this file to poly.toml and delete what you do not need. Saving it
# unchanged does nothing at all: every live key here is set to poly's own
# default, and the lines that show a different value are commented out.
#
# A misspelled key fails the parse rather than being ignored, so a setting that
# survives startup is a setting that is doing something. The three places that
# cannot work that way are the ones whose keys you choose -- a tool name, a
# `[format.<lang>]` table, a `[languages.map]` value -- and those are reported
# as warnings instead, because you find out anyway: the tool you meant to turn
# off keeps reporting, and the language you meant to configure keeps formatting
# at its defaults.
#
# Configs merge upward: poly reads every poly.toml from the file's directory to
# the filesystem root, with the nearest one winning field by field. Arrays
# replace rather than append, so a package that sets its own `exclude` drops the
# repo-root list rather than adding to it.
#
# Both the CLI and the editor read this file. That is the point: a setting only
# CI sees means the editor is working from a different picture of the project.

# ── [languages.map] ────────────────────────────────────────────────────────
# Glob -> language id, for files poly's built-in table gets wrong or has never
# heard of. Patterns match the file name (`*.tpl`); one containing a `/` matches
# the whole path. Order in the file is the order they are tried.
#
# Default: empty. Built-in detection covers these ids, and they are the values
# this table accepts:
#
#   astro, c, cpp, css, dockerfile, go, graphql, handlebars, hcl, html,
#   jinja, json, jupyter, less, lua, markdown, protobuf, python, rust, scss,
#   shellscript, sql, svelte, swift, terraform, toml, typescript, vue, xml,
#   yaml
#
# Mapping to an id poly has no formatter or linter for is not an error -- the
# file is simply skipped.
[languages.map]
# "*.tpl" = "jinja"
# "deploy/*.conf" = "yaml"

# ── [format] ───────────────────────────────────────────────────────────────
[format]
# Paths `poly fmt` must never rewrite, as gitignore-style globs anchored at
# *this* file's directory. Applies on top of .gitignore, and unlike it survives
# --no-ignore: this is the project saying "never touch", not the VCS saying
# "do not track". Naming a file directly on the command line still formats it.
#
# e.g. ["vendor/**", "**/*.generated.ts"]
exclude = []

# Severity at or above which `poly fmt --check` exits 1. An unformatted file is
# reported as a `warning`, so anything stricter than that makes formatting
# advisory: still listed, no longer fatal.
#
# error | warning | info | hint | never
# "hint" is the lowest severity poly emits, so everything is fatal.
fail-on = "hint"

# ── [format.<lang>] ────────────────────────────────────────────────────────
# Three knobs, and deliberately only three: the ones every formatter agrees on.
# Anything engine-specific belongs in that engine's own config file, which poly
# defers to when the project has one.
#
# These reach the embedded engines only. Languages that dispatch to an external
# tool are configured by that tool -- rustfmt.toml, .editorconfig, and so on:
#
#   c, cpp, go, protobuf, rust, shellscript, swift, terraform
#
# Setting a knob the engine does not have fails the run and names the key,
# rather than applying two of three and leaving you to diff the output. A table
# for something that is not a language at all is a warning, not a failure --
# the language it was meant for keeps formatting at its defaults, which is
# visible in the next `poly fmt --check`.
#
# A project with a .editorconfig gets its indent_style / indent_size /
# max_line_length for free -- those three keys are exactly these three knobs, so
# there is nothing to copy over. Keys written here win, key by key: poly.toml
# setting line-width and .editorconfig setting the indent means both apply. The
# asymmetry is deliberate -- a value the engine cannot act on is dropped quietly
# when .editorconfig said it and fails the run when this file did. That file is
# aimed at every editor the repo has ever opened; this one is aimed at poly.
#
# Defaults are each engine's own, applied when the key is absent:
#
#   language                      line-width  indent-width  use-tabs
#   typescript                    120         2             false
#   json                          120         2             false
#   toml                          120         2             false
#   lua                           120         4             true
#   dockerfile                    120         2             (rejected)
#   python / jupyter              88          4             false
#   markdown                      80          (rejected)    (rejected)
#   css / scss / less             80          2             false
#   html / vue / svelte /         80          2             false
#     astro / jinja / handlebars
#   graphql                       80          2             false
#   yaml                          80          2             (rejected)
#   xml                           (rejected)  2             (rejected)
#   sql                           (rejected)  (rejected)    (rejected)
#
# sql is sqruff's: it owns its layout rules, so configure it in .sqruff rather
# than half-applying poly's on top.
#
# Values outside the ranges below fail the parse. They are bounded well past
# anyone's taste and well short of the values that are only ever typos: 1000
# columns is roughly what an 8K display fits at a small font, and 16 is twice
# the widest indent in real use.
#
# [format.python]
# line-width = 100    # 1..=1000
# indent-width = 4    # 1..=16
# use-tabs = false    # true | false
#
# [format.typescript]
# line-width = 100

# ── [lint] ─────────────────────────────────────────────────────────────────
[lint]
# Same shape and same anchoring as [format].exclude, and a separate list: the
# generated file you refuse to reformat is often one you still want linted.
#
# e.g. ["third_party/**"]
exclude = []

# Same key, separate value, because the two policies genuinely differ:
# "unformatted files fail the build, spelling suggestions do not" is a common
# and coherent position. typos reports at `info`, most linters at `warning`,
# syntax errors at `error`.
#
# `never` is a real option, not an escape hatch: `poly check` as a report with
# the pipeline gated on something else is a reasonable way to adopt poly on a
# codebase that would otherwise light up red on day one.
fail-on = "hint"

# ── [lint.per-file-ignores] ────────────────────────────────────────────────
# Glob -> the rules that path may not report. The narrower neighbour of
# `exclude`: a fixture with a deliberate typo or a vendored script with one
# unquoted expansion is still worth linting for everything else, and dropping
# the whole file to silence one rule is how a suppression stops being
# reviewable.
#
# Codes are spelled the way poly prints them. A finding reading
#
#   tests/fixtures/bad.py:1:8: warning [ruff/F401] `os` imported but unused
#
# is silenced by copying `ruff/F401` out of that line -- there is no second
# syntax to look up. `tool/*` covers every rule from one tool. Anything else,
# including a bare `F401`, fails the parse rather than matching nothing.
#
# Globs are anchored at this file's directory, like [format].exclude. Both the
# CLI and the editor consult this, so a rule silenced here is gone from
# Problems too.
#
# Default: empty.
[lint.per-file-ignores]
# "tests/fixtures/**" = ["ruff/F401", "typos/typo"]
# "vendor/*.sh" = ["shellcheck/*"]

# ── [walk] ─────────────────────────────────────────────────────────────────
[walk]
# Walk paths beginning with a dot. Off by default, because a dot prefix is how a
# tree says "machinery, not source", and most of what it hides is enormous
# (.venv, .terraform, editor state). `.github` is walked either way -- workflows
# are source. `.git` is walked under no setting at all.
#
# The CLI's --hidden does the same for one run. This key exists for the project
# whose sources genuinely live under a dotted directory, because that has to
# hold for the editor too, and a flag only the CLI can pass would leave the
# editor seeing a smaller project than CI does.
include-hidden = false

# ── [tools] ────────────────────────────────────────────────────────────────
# Where an external tool comes from, per tool. Three kinds of value:
#
#   "off"             never run it; poly stays quiet about it being absent
#   "<path>"          use this binary (anything containing a / or \, absolute
#                     or relative to this file's directory)
#   "<version>"       download this version instead of poly's pinned one
#
# Default: absent, i.e. poly's own pinned version, downloaded on first use into
# ~/.cache/poly/tools and verified against a recorded sha256. If there is no
# managed build for the platform, PATH is tried before poly reports it missing.
# `poly tools list` prints what each name resolved to and why.
#
# A path that does not exist stops the run: poly would otherwise skip that tool
# and report a green build over files nothing checked. A name that is not one of
# the ones below is a warning -- the tool you meant keeps running, and you see
# its findings.
#
# The whole set, as of poly 0.10.0:
#
#   actionlint          1.7.12   downloaded on first use
#   buf                 1.72.0   downloaded on first use
#   cargo               system   from the project's toolchain, on PATH
#   clang-format        system   from the project's toolchain, on PATH
#   clangd              -        language server, from PATH
#   deadcode            -        whole-program analysis (`poly deadcode`)
#   gofumpt             0.11.0   downloaded on first use
#   golangci-lint       2.13.2   downloaded on first use
#   gopls               -        language server, from PATH
#   hadolint            2.15.1   downloaded on first use
#   knip                -        whole-program analysis (`poly deadcode`)
#   lua-language-server -        language server, from PATH
#   ruff                -        compiled into poly; remove the entry
#   rust-analyzer       -        language server, from PATH
#   selene              -        compiled into poly; remove the entry
#   shellcheck          0.11.0   downloaded on first use
#   shfmt               3.13.1   downloaded on first use
#   sourcekit-lsp       -        language server, from PATH
#   stylua              -        compiled into poly; remove the entry
#   swift-format        system   from the project's toolchain, on PATH
#   swiftlint           0.65.1   downloaded on first use
#   terraform           system   from the project's toolchain, on PATH
#   terraform-ls        -        language server, from PATH
#   tflint              0.64.0   downloaded on first use
#   typos               -        compiled into poly; remove the entry
#   vulture             -        whole-program analysis (`poly deadcode`)
#
# `cargo` is the entry for `cargo clippy`: clippy is a subcommand, not a binary
# poly invokes on its own, so `cargo = "off"` is how a project turns Rust lint
# off. It has to come from the project's toolchain -- clippy is built against
# one exact rustc, and a downloaded one would disagree with the compiler that
# builds the crate.
#
# buf is one binary doing three jobs -- it formats protobuf, lints it, and is
# the language server `poly lsp` starts for it -- so an entry here governs all
# three at once. "off" leaves .proto files untouched by every one of them.
#
# The language servers `poly lsp` starts, and the whole-program analyses
# `poly deadcode` runs, take the same two answers by the name poly runs them
# under:
#
#   rust-analyzer = "off"                turn off one language's features
#                                        without turning off the whole proxy
#   rust-analyzer = "/opt/rust-glancer"  run a drop-in replacement instead
#
# A version is not one of them: these come from the project's own toolchain and
# poly never downloads them.
#
# prettier, biome, eslint and rustfmt are not listed here on purpose: poly uses
# them only when it finds them installed in the project alongside their own
# config, and never downloads them. Removing the config is how you turn those
# off.
#
# selene, stylua, ruff and typos are listed as compiled in because
# they are no longer binaries: poly formats and lints Lua and Python and
# spell-checks every file in-process, so there is nothing to pin, disable or
# point elsewhere. Naming any of them here is reported rather than ignored, so
# that `selene = "off"` cannot look like it turned something off.
# `[format.lua]` and `[format.python]` set the layout; a selene.toml still
# configures the Lua lints, a pyproject.toml or ruff.toml still selects the
# Python rules, and a _typos.toml still holds `[default.extend-words]` and
# `[files] extend-exclude` -- poly reads the project's own file. Spelling is
# also the one check with no language, so it reads exactly the files poly's walk
# finds, which includes the ones poly has no language for; `--hidden` and
# `--no-ignore` reach it too, and `[lint] exclude` and
# `[lint.per-file-ignores]` silence it like any other.
[tools]
# shellcheck = "C:/tools/shellcheck.exe"
# tflint = "off"
