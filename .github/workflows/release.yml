name: Release

# Tag vX.Y.Z (or vX.Y.Z-rc.N for a pre-release) -> 6-platform build ->
# 8 VSIX (6 platform poly-lsp + 2 universal: poly-syntax-highlight and
# poly-editor) + 6 binaries + SHA256SUMS + third-party notices, uploaded to a
# GitHub Release.
#
# Three dot-separated parts, not `v*`: the last step of this workflow force-
# pushes the moving major tag (`v0`), which `v*` also matched. That published
# an assetless release named `v0`, and because GitHub picks "latest" by release
# rather than by tag shape, `/releases/latest` then resolved to it -- so
# `uses: linzeyan/vscode-syntax@v0` downloaded a binary that was not there.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  # Publishing ghcr.io/<owner>/poly.
  packages: write

jobs:
  build:
    name: ${{ matrix.vsce }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              vsce: linux-x64,
            }
          - {
              target: aarch64-unknown-linux-gnu,
              os: ubuntu-24.04-arm,
              vsce: linux-arm64,
            }
          - { target: aarch64-apple-darwin, os: macos-14, vsce: darwin-arm64 }
          # arm64 runner runs the x64 smoke test through Rosetta.
          - { target: x86_64-apple-darwin, os: macos-14, vsce: darwin-x64 }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              vsce: win32-x64,
            }
          - {
              target: aarch64-pc-windows-msvc,
              os: windows-11-arm,
              vsce: win32-arm64,
            }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extensions/lsp/package.json
      - name: Build
        working-directory: cli
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        working-directory: cli
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/poly
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" fmt --check . || test $? -le 1
          bytes=$(wc -c < "$BIN")
          mb=$(( bytes / 1048576 ))
          echo "::notice title=binary size::${{ matrix.target }} ${mb}MB ($bytes bytes)"
          test "$bytes" -lt $(( 40 * 1048576 )) || {
            echo "::error title=binary size::${{ matrix.target }} ${mb}MB exceeds the 40MB budget (02 §9)"
            exit 1; }
      - name: Package platform VSIX
        shell: bash
        run: |
          BIN=cli/target/${{ matrix.target }}/release/poly
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          pnpm --dir extensions/lsp install --frozen-lockfile
          tools/package-lsp.sh ${{ matrix.vsce }} "$BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.vsce }}
          path: |
            cli/target/${{ matrix.target }}/release/poly
            cli/target/${{ matrix.target }}/release/poly.exe
            extensions/lsp/poly-lsp-*.vsix
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extensions/lsp/package.json
      - name: Verify tag matches extension versions
        run: |
          BASE="${GITHUB_REF_NAME#v}"; BASE="${BASE%%-*}"
          for f in extensions/lsp/package.json extensions/syntax/package.json \
                   extensions/editor/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$BASE" ]; then
              echo "version mismatch: $f has $v, tag implies $BASE" >&2
              exit 1
            fi
          done
      # Universal, not per-platform: neither of these carries the poly binary,
      # so one VSIX serves every machine (02 §11.4).
      - name: Package universal VSIX
        run: |
          (cd extensions/syntax && pnpm dlx @vscode/vsce package --allow-missing-repository)
          # Built here rather than taken from the tree: dist/ is committed for
          # convenience, and a release has to ship what the source says.
          pnpm --dir extensions/editor install --frozen-lockfile
          pnpm --dir extensions/editor run build
          # --no-dependencies for the same reason package-lsp.sh passes it:
          # nothing from node_modules ships, and vsce cannot walk pnpm's
          # symlinked tree to prove that for itself.
          (cd extensions/editor && pnpm dlx @vscode/vsce package --no-dependencies --allow-missing-repository)
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Assemble release assets
        run: |
          mkdir dist
          for d in artifacts/release-*; do
            vsce="${d#artifacts/release-}"
            find "$d" -name 'poly-lsp-*.vsix' -exec cp {} dist/ \;
            # Artifacts keep repo-relative nesting; locate binaries by name.
            exe=$(find "$d" -name poly.exe -type f | head -1)
            if [ -n "$exe" ]; then
              cp "$exe" "dist/poly-$vsce.exe"
            else
              find "$d" -name poly -type f -exec cp {} "dist/poly-$vsce" \;
            fi
          done
          cp extensions/syntax/poly-syntax-highlight-*.vsix dist/
          cp extensions/editor/poly-editor-*.vsix dist/
          cp extensions/lsp/THIRD-PARTY-NOTICES.md dist/THIRD-PARTY-NOTICES-cli.md
          cp extensions/syntax/THIRD-PARTY-NOTICES.md dist/THIRD-PARTY-NOTICES-grammars.md
          # The bare binaries are downloaded on their own, and MIT asks for the
          # notice to travel with the copy. The VSIX carry their own.
          cp LICENSE dist/LICENSE
          cd dist && sha256sum -- * > SHA256SUMS && ls -l
      - name: Sanity-check asset counts
        run: |
          # find rather than ls: a release asset is named from a matrix entry,
          # so a name that surprises `ls` is exactly the case worth surviving.
          lsp=$(find dist -type f -name 'poly-lsp-*.vsix' | wc -l)
          bins=$(find dist -type f -name 'poly-*' ! -name '*.vsix' ! -name '*.md' | wc -l)
          universal=$(find dist -type f \( -name 'poly-syntax-highlight-*.vsix' \
            -o -name 'poly-editor-*.vsix' \) | wc -l)
          test "$lsp" -eq 6 || { echo "expected 6 poly-lsp VSIX, got $lsp" >&2; exit 1; }
          test "$bins" -eq 6 || { echo "expected 6 binaries, got $bins" >&2; exit 1; }
          test "$universal" -eq 2 || { echo "expected 2 universal VSIX, got $universal" >&2; exit 1; }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" $PRE --generate-notes \
            --title "$GITHUB_REF_NAME" dist/*
      # The image assembles the binaries the release just published rather
      # than compiling its own, so what runs in a container is byte-identical
      # to what a user downloads. See the Dockerfile for why.
      - name: Stage binaries for the image
        run: |
          mkdir -p docker
          cp dist/poly-linux-x64 docker/poly-amd64
          cp dist/poly-linux-arm64 docker/poly-arm64
      # The runner is amd64 and the image runs `apt-get` and `poly --version`
      # inside each target platform, so the arm64 half needs emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/poly
          # `latest` only from a final tag: a pre-release must never become
          # what `docker run ghcr.io/.../poly` picks up by default.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Consumers write `uses: linzeyan/vscode-syntax@v0`; that tag has to
      # follow the releases or it pins them to whatever shipped first. Moved
      # here rather than on a schedule so it can never lag a release.
      - name: Move the major action tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          # HEAD, not the tag name: checkout is shallow here and the tag ref
          # may not be present locally, while HEAD is the tagged commit.
          git tag -f "$major" HEAD
          git push -f origin "refs/tags/$major"
