name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here that touches Rust shares one cache, so they have to agree on
# the profile that filled it: a different LTO setting is a different fingerprint
# and therefore a cold build in every job but the first. Set once, at the top,
# rather than per job -- the docker job disagreeing with the rest is exactly how
# this drifts back.
#
# Dropping fat LTO is safe because nothing in this file ships its binary.
# build.yml compiles the release profile on four targets, and release.yml is
# what users install. Here the binary is a test fixture.
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  grammars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The pnpm version comes from the one package.json that pins it, so CI
      # and a developer machine cannot end up on different resolvers.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extensions/lsp/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync grammars from pinned sources
        env:
          # Even the pinned path fetches from api.github.com, and runner IPs
          # are shared, so 60 anonymous requests per hour runs out during a
          # busy afternoon. grammar-sync.yml has always passed this; this job
          # did not, and failed as soon as main saw a few pushes in a row.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pip install pyyaml
          python tools/grammar-sync.py
      - name: Verify sync output is committed (no drift)
        run: git diff --exit-code
      - name: Tokenize fixtures
        run: |
          mkdir -p /tmp/tokdeps
          pnpm --dir /tmp/tokdeps init
          pnpm --dir /tmp/tokdeps add vscode-textmate vscode-oniguruma
          node tools/tokenize-check.mjs /tmp/tokdeps/node_modules
      - name: Package VSIX
        working-directory: extensions/syntax
        run: pnpm dlx @vscode/vsce package --allow-missing-repository

  # release.yml publishes this image, but a Dockerfile only exercised when a
  # tag is pushed is a Dockerfile that breaks when a tag is pushed. Native
  # amd64 only: the release build covers arm64 under emulation, and paying for
  # that on every push would buy nothing this job can catch.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          shared-key: ci
          save-if: false
          cache-on-failure: true
      # The binary this stages is a fixture, not a shipped artifact: what the
      # job asks is whether the Dockerfile assembles around a binary and whether
      # the image can reach the network and git. build.yml is what compiles the
      # profile users get. Before the shared cache this step paid for a fat-LTO
      # link nobody read, which is most of why the job took four minutes.
      - name: Stage a binary for the image
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          mkdir -p docker
          cp cli/target/release/poly docker/poly-amd64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: poly:ci
      # Building proves it assembles; running proves the parts fit. The mount
      # is how a CI job would actually use it, and `check` reaches for the
      # network and for git, which is where a too-thin base image shows up.
      #
      # --strict is what makes this a check rather than a demo: a linter that
      # failed to download becomes a failed step instead of a skipped file.
      # That is also why the paths stop short of `cli/`. The image ships no
      # language toolchain on purpose, `cargo clippy` only ever comes from one,
      # and Rust would therefore be missing here forever -- the cli job lints
      # it on a runner that has cargo. These four cover every tool the image
      # does download: actionlint, hadolint and shellcheck.
      - name: The image can lint a repository
        run: |
          docker run --rm -v "$PWD:/work" poly:ci --version
          docker run --rm -v "$PWD:/work" poly:ci check --strict \
            .github Dockerfile extensions tools

  # Same reason as the docker job: an action only exercised by whoever adopts
  # it is an action that breaks for whoever adopts it. `uses: ./` runs the
  # working tree's action.yml, so a change is tested before it is tagged.
  # The matrix is the platform-detection case statement, which is the only
  # part that cannot be checked by reading it.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./
      # Running the binary at all is the signal that matters here: a wrong
      # asset for the platform fails as "cannot execute", which is exactly the
      # bug the case statement can have. Linting the repo is left to the cli
      # and docker jobs -- doing it on three OSes would trade a real gate for
      # three chances to download a linter from a flaky mirror.
      - name: poly is on PATH, and the outputs describe it
        shell: bash
        run: |
          set -euo pipefail
          test "$(poly --version)" = "poly ${{ steps.setup.outputs.version }}"
          test -x "${{ steps.setup.outputs.path }}"

  # Compilation and the drift gates: everything that needs cargo and nothing
  # that needs a language server, a browser or an extension host. This is the
  # job that fills the shared cache, so it is the only one that saves it.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          shared-key: ci
          cache-on-failure: true
      # rustfmt first: it needs no build, so a formatting slip fails in seconds
      # instead of after the workspace compiles.
      - name: Rust formatting
        working-directory: cli
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: cli
        run: cargo clippy --all-targets -- -D warnings
      # A panic here was unreadable from outside the org: the job log needs a
      # token not every collaborator has, and the annotation said no more than
      # "exit code 101". That is how an ETXTBSY bug in poly-tools survived a
      # full round of guessing before someone with the log pasted one line of
      # it. Annotations and the job summary are public, so the failure goes
      # there instead. libtest's JSON output is nightly-only; its text has a
      # `failures:` block naming what broke and printing the panic, which is
      # the part worth republishing.
      - name: Test
        working-directory: cli
        run: |
          status=0
          cargo test --workspace --release >"$RUNNER_TEMP/test.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/test.log"
          if [ "$status" -ne 0 ]; then
            body=$(awk '/^failures:$/ {found = 1} found' "$RUNNER_TEMP/test.log" | head -200)
            # A compile error never reaches a failures block, and that is
            # exactly when the log is least readable from here -- fall back to
            # the end of the output, where rustc puts the error.
            [ -n "$body" ] || body=$(tail -50 "$RUNNER_TEMP/test.log")
            # Tildes, not backticks: a backtick fence inside the format string
            # reads as a command substitution to shellcheck (SC2016), and
            # markdown fences both ways.
            printf '### cargo test (exit %s)\n\n~~~\n%s\n~~~\n' "$status" "$body" \
              >>"$GITHUB_STEP_SUMMARY"
            # One line per failed test, so the commit page names them without
            # anyone opening the summary.
            grep -E '^test .+ FAILED$' "$RUNNER_TEMP/test.log" |
              sed -E 's/^test (.+) \.\.\. FAILED$/::error::cargo test: \1/' || true
          fi
          exit $status
      - name: Third-party notices are current (A9)
        run: |
          python3 tools/third-party-notices.py --self-test
          python3 tools/third-party-notices.py --check
      # Offline on purpose: it compares the lock against the registry, nothing
      # upstream. A hand-edited version bump that skips tool-sync.py leaves
      # every platform but the editor's on trust-on-first-use, which looks
      # exactly like a pin until someone else downloads.
      - name: External tool pins are locked
        run: python3 tools/tool-sync.py --check
      # The third drift gate, and the only one whose failure lands in
      # documentation rather than in a build: poly.example.toml is generated, so
      # a tool poly pins, embeds or stops shipping cannot quietly leave the file
      # describing a poly that no longer exists. --self-test first for the same
      # reason the notices gate has one -- this diffs the binary against a file
      # the binary wrote, so a generator that stopped generating would pass.
      - name: poly.example.toml is current
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          cli/target/release/poly config export --self-test
          cli/target/release/poly config export | diff -u poly.example.toml -
      - name: LSP smoke test
        run: python tools/lsp-smoke.py cli/target/release/poly
      # Dogfood (M4): the repo's own poly.toml, the binary just built, the same
      # two commands the README tells users to put in their CI. This was a
      # documented gate that was never actually wired, so every dogfood run was
      # whatever a human remembered to type locally.
      #
      # --strict because a runner missing a toolchain must fail here rather
      # than quietly format less than a developer's machine does: R5/A4 is the
      # whole point, and a gate that only checks the files it happens to
      # resolve is not a gate.
      - name: Dogfood (poly formats and lints its own repo)
        # Reading a job log needs a token this repo's collaborators do not all
        # have; annotations and the job summary are public. This used to reprint
        # poly's prose one line per annotation, all of them anchored to the job.
        # poly now reports position, severity and fail-on verdict as JSON, so
        # each finding lands on the line that caused it.
        #
        # The reports go to RUNNER_TEMP rather than the worktree: written here,
        # the fmt gate's report would be a file the check gate then lints.
        run: |
          poly=cli/target/release/poly
          status=0
          gate() {
            local name=$1
            shift
            "$poly" "$@" --format json . >"$RUNNER_TEMP/$name.json"
            local code=$?
            if [ "$code" -gt "$status" ]; then status=$code; fi
            python3 tools/ci-annotate.py "$RUNNER_TEMP/$name.json"
            # poly renders its own table. Building one here would be a second
            # definition of what a finding looks like, and the two would drift.
            local table
            table=$("$poly" "$@" --format table_markdown .)
            if [ -n "$table" ]; then
              printf '### poly %s\n\n%s\n\n' "$*" "$table" >>"$GITHUB_STEP_SUMMARY"
            fi
          }
          gate fmt fmt --check --strict
          gate check check --strict
          exit $status
      # release.yml checks this too, but only when a tag is pushed -- by then
      # the drift is already committed. The extension warns at runtime when its
      # binary is a different version, so a mismatch on main would ship a
      # warning badge to every user.
      #
      # This covered the two manifests and nothing else, which is how the
      # extension README spent 0.7.0 quoting the release before it. The prose
      # sites are the ones a release actually forgets, since they are the ones
      # no build reads. Passing the binary keeps what the shell version had:
      # the manifest is the source, the binary is what users get, and a build
      # from a different tree has to fail here rather than ship.
      - name: Versions agree, in manifests and in prose
        run: python3 tools/bump.py --check cli/target/release/poly

  # The acceptance suites, which is everything that needs somebody else's
  # toolchain present. Split out of the cli job rather than handed its binary
  # through an artifact: the cli job is one serial chain, so a `needs:` would
  # add this job's 3 minutes to its 2.5 instead of overlapping them. Rebuilding
  # from the shared cache costs about 40 seconds and buys the whole overlap.
  acceptance:
    runs-on: ubuntu-latest
    env:
      # One place for each pinned version: the install commands and the cache
      # key both read them here, so a bump cannot move one and not the other --
      # a stale key would serve yesterday's server to today's probe.
      GOPLS_VERSION: v0.23.0
      # Was `@latest`, which made the analyser under test a different program on
      # different days and gave the cache nothing to key on.
      DEADCODE_VERSION: v0.49.0
      TERRAFORM_LS_VERSION: 0.39.0
      LUA_LS_VERSION: 3.19.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-acceptance drives `cargo clippy` over a fixture, so the
          # component has to be here rather than added mid-job.
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          shared-key: ci
          save-if: false
          cache-on-failure: true
      # The pinned half of the toolchain, and the expensive half: `go install
      # gopls` compiles a large Go program from source, and it did so on every
      # push. Everything here is content-addressed by version, so the only miss
      # is a bump.
      #
      # They install under $HOME rather than /usr/local and /opt because a cache
      # cannot restore what it needed sudo to write.
      - name: Cache the pinned servers and analysers
        id: servers
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/ci-tools
          key: servers-${{ runner.os }}-gopls${{ env.GOPLS_VERSION }}-deadcode${{ env.DEADCODE_VERSION }}-tfls${{ env.TERRAFORM_LS_VERSION }}-lua${{ env.LUA_LS_VERSION }}
      - name: Install the pinned servers and analysers
        if: steps.servers.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ci-tools/bin"
          go install "golang.org/x/tools/gopls@$GOPLS_VERSION"
          # Not part of the Go toolchain: deadcode lives in golang.org/x/tools,
          # and without it the cross-module section of the Go gate would be the
          # one thing here nobody measures.
          go install "golang.org/x/tools/cmd/deadcode@$DEADCODE_VERSION"
          # terraform-ls is the only server whose binary is not itself the
          # language server (`terraform-ls serve`), so it is the only thing
          # exercising the LAUNCH table. Without it that path is untested here.
          curl -sSLo /tmp/terraform-ls.zip \
            "https://releases.hashicorp.com/terraform-ls/${TERRAFORM_LS_VERSION}/terraform-ls_${TERRAFORM_LS_VERSION}_linux_amd64.zip"
          unzip -q -o -d "$HOME/ci-tools/bin" /tmp/terraform-ls.zip
          # lua carries the probe's only merged-diagnostics case: it is the one
          # language here where poly runs a linter of its own (selene) while a
          # server is also publishing, so it is the only thing proving the two
          # sets are merged rather than one erasing the other.
          #
          # The tarball has no top-level directory and the binary needs the
          # meta/ and script/ trees beside it, so it gets its own prefix rather
          # than being unpacked next to the loose binaries.
          curl -sSLo /tmp/lua-ls.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUA_LS_VERSION}/lua-language-server-${LUA_LS_VERSION}-linux-x64.tar.gz"
          mkdir -p "$HOME/ci-tools/lua-language-server"
          tar xzf /tmp/lua-ls.tar.gz -C "$HOME/ci-tools/lua-language-server"
      # Runs whether or not the cache hit -- PATH does not survive in a cache.
      - name: Put them on PATH
        run: |
          {
            echo "$(go env GOPATH)/bin"
            echo "$HOME/ci-tools/bin"
            echo "$HOME/ci-tools/lua-language-server/bin"
          } >> "$GITHUB_PATH"
      # The two that are not worth caching: both come from a package manager
      # already on the runner, and neither is compiled here.
      - name: Install clangd and rust-analyzer
        run: |
          sudo apt-get install -y clangd
          rustup component add rust-analyzer
      - name: Build poly
        run: cargo build --release --manifest-path cli/Cargo.toml
      - name: Language server proxy probe
        run: |
          # The probe skips a language when its server is missing, which is
          # right on a developer's machine and wrong here: a gate that silently
          # turns into a no-op is worse than no gate. Assert each one is
          # present before running it. Since the servers are cached, this is
          # also what catches a cache that restored something unusable.
          #
          # swift is the one language left out: there is no Swift toolchain on
          # these runners. It stays verified locally on macOS, and the probe
          # prints the skip rather than passing quietly.
          #
          # buf is absent from this list on purpose, not by oversight: poly
          # downloads it rather than finding it on PATH, so PATH has nothing to
          # assert. Its case runs unconditionally for the same reason -- if buf
          # does not come up, that is the finding.
          gopls version
          rust-analyzer --version
          clangd --version
          terraform-ls version
          lua-language-server --version
          python tools/lsp-proxy-probe.py cli/target/release/poly
      # The other half of Go, and the half no gate touched until it was written:
      # gofumpt and golangci-lint are poly's own to drive, and the Rust tests
      # only ever covered the path where they do not run. `go` is on the runner
      # already, and gofmt comes with it -- which the fmt check needs, because
      # telling gofumpt from gofmt is the point of it.
      - name: Go support acceptance
        run: |
          go version
          gofmt --help >/dev/null
          python tools/go-acceptance.py cli/target/release/poly
      # The second whole-directory linter. Nothing to install: poly downloads
      # tflint, and the bundled Terraform ruleset needs neither `tflint --init`
      # nor `terraform init`. It runs here rather than inside the Go step
      # because what it measures is scope nesting, which Go does not have by
      # default and Terraform does.
      - name: Terraform lint acceptance
        run: python tools/tf-acceptance.py cli/target/release/poly
      # The third one, and the only one that compiles to answer. The fixture has
      # no dependencies, so this costs seconds rather than the minutes a real
      # crate would.
      - name: Rust lint acceptance
        run: python tools/rust-acceptance.py cli/target/release/poly
      # `poly deadcode` outside Go. Neither tool is a poly download -- knip is
      # an npm dev dependency and vulture is a pip install -- so both are
      # installed here the way a project would, and the gate skips loudly if
      # either step fails rather than passing on nothing.
      - name: Dead code acceptance (knip, vulture)
        run: |
          pip install vulture
          python tools/deadcode-acceptance.py cli/target/release/poly

  # The extension halves. Same reasoning as the acceptance job: this needs a
  # poly binary and nothing the cli job produces afterwards, so it rebuilds from
  # the shared cache and runs alongside rather than behind.
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          shared-key: ci
          save-if: false
          cache-on-failure: true
      - name: Build poly
        run: cargo build --release --manifest-path cli/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extensions/lsp/package.json
      # xvfb: the extension host needs a display even with no window on screen.
      - name: Editor end-to-end (real extension host)
        working-directory: extensions/lsp
        env:
          POLY_BIN: ${{ github.workspace }}/cli/target/release/poly
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          xvfb-run -a pnpm test
      # poly-editor has no daemon to talk to and no extension host to boot: its
      # logic lives in modules that do not import vscode, so node's own test
      # runner covers it without a new dependency. The package step is the
      # other half -- a manifest VSCode would reject is not something to find
      # out during a release.
      - name: poly-editor tests, builds and packages
        working-directory: extensions/editor
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm run build
          pnpm dlx @vscode/vsce package --no-dependencies --allow-missing-repository
