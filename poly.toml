# poly formats and lints its own repo (dogfood, M4). Everything excluded here
# is a file whose bytes another program owns, so rewriting it either breaks a
# gate or gets undone on the next run:
#
#   grammars/fixtures     byte-exact inputs for the tokenize gate, several of
#                         them deliberately broken
#   sources.json          one grammar per line on purpose: 79 languages stay
#                         scannable that way, and a JSON formatter turns each
#                         entry into eight lines
#   syntaxes/, snippets/  grammars and snippets synced verbatim from upstream; the CI drift
#                         check compares them against grammar-sync output
#   sources.lock.json     grammar-sync output (and a wall of hex digests that
#                         typos reads as misspellings)
#   THIRD-PARTY-NOTICES   generated by tools/*-notices
#   dist/, pnpm-lock      esbuild and pnpm output; reformatting the lockfile
#                         breaks `pnpm install --frozen-lockfile`
#   media/github-markdown the CSS bierner.markdown-preview-github-styles
#                         publishes, copied as it ships (see its README)
#   media/plantuml        jebbs.plantuml's preview page, likewise; the page
#                         itself kept line for line with upstream's template
#   preview/excalidraw    pomdtr.excalidraw-editor's page source, kept line
#                         for line with upstream's so the two can be diffed
#   editor/markdownPdf    yzane.markdown-pdf's converter, likewise
#   editor/codeSnap       adpyke.codesnap's page, likewise
#   editor/swaggerViewer  arjun.swagger-viewer's page and schemas, likewise
[format]
exclude = [
  "grammars/fixtures/**",
  "grammars/sources.json",
  "grammars/sources.lock.json",
  "extensions/*/syntaxes/**",
  "extensions/*/snippets/**",
  "extensions/*/dist/**",
  "extensions/*/THIRD-PARTY-NOTICES*.md",
  "extensions/*/pnpm-lock.yaml",
  "extensions/lsp/media/github-markdown/**",
  "extensions/lsp/media/plantuml/**",
  "extensions/lsp/src/editor/preview/excalidraw/**",
  "extensions/lsp/src/editor/markdownPdf/**",
  "extensions/lsp/src/editor/codeSnap/**",
  "extensions/lsp/src/editor/swaggerViewer/**",
]

[lint]
exclude = [
  "grammars/fixtures/**",
  "grammars/sources.json",
  "grammars/sources.lock.json",
  "extensions/*/syntaxes/**",
  "extensions/*/snippets/**",
  "extensions/*/dist/**",
  "extensions/*/THIRD-PARTY-NOTICES*.md",
  "extensions/*/pnpm-lock.yaml",
  "extensions/lsp/media/github-markdown/**",
  "extensions/lsp/media/plantuml/**",
  "extensions/lsp/src/editor/preview/excalidraw/**",
  "extensions/lsp/src/editor/markdownPdf/**",
  "extensions/lsp/src/editor/codeSnap/**",
  "extensions/lsp/src/editor/swaggerViewer/**",
]

# No [lint.per-file-ignores] at all. Everything this repo silences is a line
# rather than a file, so every one of them is a `# poly: ignore` comment in the
# file itself -- the two Dockerfile rules on the lines they fire on, and the
# deliberate misspellings in tests/check.rs on the fixtures that carry them. A
# glob would have covered the lines nobody has written yet as well, and put the
# reason two files away from the line it excuses.
