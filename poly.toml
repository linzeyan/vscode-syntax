# poly formats and lints its own repo (dogfood, M4). Everything excluded here
# is a file whose bytes another program owns, so rewriting it either breaks a
# gate or gets undone on the next run:
#
#   grammars/fixtures     byte-exact inputs for the tokenize gate, several of
#                         them deliberately broken
#   sources.json          one grammar per line on purpose: 79 languages stay
#                         scannable that way, and a JSON formatter turns each
#                         entry into eight lines
#   syntaxes/             grammars synced verbatim from upstream; the CI drift
#                         check compares them against grammar-sync output
#   sources.lock.json     grammar-sync output (and a wall of hex digests that
#                         typos reads as misspellings)
#   THIRD-PARTY-NOTICES   generated by tools/*-notices
#   dist/, pnpm-lock      esbuild and pnpm output; reformatting the lockfile
#                         breaks `pnpm install --frozen-lockfile`
[format]
exclude = [
  "grammars/fixtures/**",
  "grammars/sources.json",
  "grammars/sources.lock.json",
  "extensions/*/syntaxes/**",
  "extensions/*/dist/**",
  "extensions/*/THIRD-PARTY-NOTICES.md",
  "extensions/*/pnpm-lock.yaml",
]

[lint]
exclude = [
  "grammars/fixtures/**",
  "grammars/sources.json",
  "grammars/sources.lock.json",
  "extensions/*/syntaxes/**",
  "extensions/*/dist/**",
  "extensions/*/THIRD-PARTY-NOTICES.md",
  "extensions/*/pnpm-lock.yaml",
]

# Two rules poly wrote, silenced for the one file in this repo that argues with
# them in its own comments. Both are judgement calls the Dockerfile already made
# and explained, and this is where poly wants that decision recorded -- it does
# not read hadolint's `# hadolint ignore=` lines, deliberately, because a
# suppression that only one of the two linters honours is the editor/CI split
# poly exists to prevent.
#
#   docker-apt-get-unpinned  the file pins nothing on purpose: Ubuntu drops the
#                            superseded version the moment a security update
#                            lands, so a pin makes the image stop building on
#                            somebody else's schedule -- and the two packages
#                            are a CA bundle and git, where the newest patch is
#                            the one you want. The same argument the file makes
#                            for `# hadolint ignore=DL3008`.
#   docker-root-user         this image is a CI tool, not a service. It writes
#                            into a checkout mounted at /work that belongs to
#                            whoever the runner runs as, and a fixed non-root
#                            UID baked in here would own none of it -- the file
#                            already works around the same mismatch with
#                            `git config --system safe.directory '*'`.
[lint.per-file-ignores]
"Dockerfile" = ["poly/docker-apt-get-unpinned", "poly/docker-root-user"]
