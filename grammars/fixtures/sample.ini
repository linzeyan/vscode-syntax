; poly daemon configuration
[server]
host = 127.0.0.1
port = 9257
idle_timeout = 300

[tools]
; explicit paths win over discovery
rustfmt = /usr/local/bin/rustfmt
shfmt =
enable_managed = true

[logging]
level = info
file = ~/.cache/poly/daemon.log
max_size_mb = 8

# hash comments are accepted too
[experimental]
cache_external_results = false
