<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- VS Code paints an activity-bar icon as a mask, so only the alpha matters.
       The screwdriver lies on top: the mask cuts a gap in the wrench around it,
       which keeps the crossing readable at 24px. -->
  <defs>
    <mask id="under-screwdriver" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff" />
      <g transform="rotate(-45 12 12)" fill="#000" stroke="#000" stroke-width="4.5" stroke-linejoin="round">
        <rect x="9.5" y="12.5" width="5" height="9" rx="2" />
        <path d="M11.25 5.5h1.5V12.5h-1.5z" />
      </g>
    </mask>
  </defs>
  <g mask="url(#under-screwdriver)">
    <path transform="rotate(45 12 12)"
      fill="none"
      stroke="#000"
      stroke-width="1.5"
      stroke-linejoin="round"
      d="M10.5 2.29V5h3V2.29A4 4 0 0 1 13.5 9.71V19.5a1.5 1.5 0 0 1-3 0V9.71A4 4 0 0 1 10.5 2.29z" />
  </g>
  <g transform="rotate(-45 12 12)">
    <path fill="#000" d="M10.75 2.5h2.5l-.5 3h-1.5z" />
    <path fill="#000" d="M11.25 5.5h1.5v7h-1.5z" />
    <rect x="9.5" y="12.5" width="5" height="9" rx="2" fill="none" stroke="#000" stroke-width="1.5" />
  </g>
</svg>
