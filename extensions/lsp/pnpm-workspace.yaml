# pnpm blocks dependency lifecycle scripts and wants the decision recorded
# rather than left implicit. The only one here is esbuild's postinstall, which
# fetches the platform binary its own optional dependency already provides, so
# skipping it changes nothing: the bundle builds either way.
#
# false rather than true, so an install runs no third-party code at all. That
# already had to hold -- this repo is developed with ignore-scripts on globally,
# and a dependency that only works when a postinstall runs would work in CI and
# nowhere else.
allowBuilds:
  esbuild: false
