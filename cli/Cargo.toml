[workspace]
resolver = "2"
members = ["crates/poly-cli", "crates/poly-core", "crates/poly-engines", "crates/poly-tools"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
dprint-plugin-dockerfile = "0.6"
dprint-plugin-json = "0.23"
dprint-plugin-markdown = "0.22"
dprint-plugin-toml = "0.8"
dprint-plugin-typescript = "0.96"
# .editorconfig parsing. Worth a dependency rather than a hand-rolled INI
# reader: the format's globs are their own dialect ({a,b} and {n1..n2}, which
# globset does not do), the file chain stops at `root = true`, and
# `indent_size = tab` defers to tab_width. Getting 95% of that right is the bad
# outcome -- it reads a project's real config and quietly formats to something
# else.
ec4rs = "1.2"
# Lua's parser, needed directly because selene lints an `Ast` rather than a
# string and re-exports nothing.
full_moon = "2.2"
globset = "0.4"
ignore = "0.4"
lsp-server = "0.7"
lsp-types = "0.94"
malva = "0.16"
markup_fmt = "0.27"
pretty_graphql = "0.2"
pretty_yaml = "0.6"
rayon = "1"
# The Diagnostic type ruff_linter hands findings back in. A direct dependency
# because naming it is unavoidable and ruff_linter re-exports nothing.
ruff_db = "=0.0.12"
# SourceMap: how a cell-by-cell notebook format is written back into the
# .ipynb, and the type Notebook::update takes.
ruff_diagnostics = "=0.0.12"
# ruff_python_formatter takes IndentStyle in its API but does not re-export it,
# so [format.python] use-tabs needs the type from here. Same exact pin.
ruff_formatter = "=0.0.12"
# ruff's linter, embedded rather than downloaded. This is the crate ruff's own
# CLI is built from, so the rules, codes, fixes, documentation links and
# `# noqa` handling are the tool's own rather than poly's reading of them --
# which is the whole reason to link it instead of parsing its JSON.
#
# 0.16.6 rather than the 0.16.5 binary poly used to download: 0.16.6 is the
# first release whose ruff_* dependencies are the 0.0.12 line the formatter is
# pinned to, and one line for both is what keeps a single ruff inside poly.
ruff_linter = "=0.16.6"
# The .ipynb container: cell offsets on the way in, cell-relative positions on
# the way out.
ruff_notebook = "=0.0.12"
# PySourceType: .py / .pyi / .ipynb, which the linter needs and the formatter
# infers for itself.
ruff_python_ast = "=0.0.12"
# ruff's formatter is an unstable internal crate; exact pin required (M0 decision).
#
# 0.0.10 -> 0.0.12 to meet ruff_linter 0.16.6 on one ruff_* line. Verified not
# to change a byte of anyone's Python: the two versions were linked side by
# side and run over 22,663 files (the CPython 3.12 standard library, its test
# suite and site-packages) at the defaults, and over 6,000 of them again at
# every setting [format.python] can reach -- identical output, and no file that
# one version parsed and the other refused.
ruff_python_formatter = "=0.0.12"
# Byte offsets into a notebook's concatenated source. Needed to build the
# SourceMap a cell-by-cell format hands back to Notebook::update.
ruff_text_size = "=0.0.12"
# pyproject.toml / ruff.toml discovery and resolution -- a project's own rule
# selection, which is the point of embedding ruff rather than hardcoding a
# default set poly invented.
ruff_workspace = "=0.0.12"
# Lua, embedded as a pair: both crates parse with full_moon, so the second one
# costs little once the first is linked. Exact pins for a different reason than
# ruff's -- these two crates *are* the answer poly prints. A minor bump changes
# what stylua lays out and which lints selene ships, so a caret pin would let
# `cargo update` silently change what `poly fmt --check` and `poly check` call
# clean. The features are the ones upstream's own release builds use, so poly
# reads the same dialects the binaries did: StyLua's release workflow passes
# `lua52,lua53,lua54,luau,luajit,cfxlua`, and selene's binary takes selene-lib
# with default features off and only `roblox` back on.
#
# stylua's remaining defaults are off because poly already is the thing they
# provide, not to save space: `editorconfig` would give stylua a second reader
# of a file poly parses itself and feeds in through FormatOptions, and `lsp` is
# a whole second language server inside the one poly is running.
selene-lib = { version = "=0.31.0", default-features = false, features = [
  "roblox",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Standard-library definitions are YAML; selene-lib already depends on this, so
# reading a project's own `<std>.yml` costs nothing new.
serde_yaml = "0.9"
# Line diff for Format Selection: poly formats the whole document and then has
# to say which parts of the result fall inside the selection. Free in build
# terms -- ruff_python_formatter already pulls it in -- and a hand-rolled LCS
# would be the one piece of this that nobody could review by reading it.
similar = "3"
# sqruff's lib API is unstable; exact pin required (M0 decision).
sqruff-lib = "=0.40.0"
# See selene-lib above for the pin and the feature list.
stylua = { version = "=2.5.2", default-features = false, features = [
  "cfxlua",
  "lua52",
  "lua53",
  "lua54",
  "luajit",
  "luau",
] }
toml = "0.8"
xmlem = "0.5"

# Size/perf trade-off: thin LTO + strip keeps the single-binary target honest
# without the slow codegen-units=1 builds during development.
[profile.release]
# The binary ships inside all six platform VSIX, so size is worth real
# latency: opt-level="s" halved it when this was measured (28.9MB -> 14.7MB on
# darwin-arm64, before Lua was embedded) for ~8% on 1MB files, which stays far
# inside the 200ms p95 budget.
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
